[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "dpa4-xray-hrmc"
version = "0.1.0"
description = "Phase 1 periodic X-ray PDF forward calculator using partial RDFs"
readme = "README.md"
requires-python = ">=3.11,<3.12"
dependencies = [
  "ase>=3.23,<4",
  "matplotlib>=3.8,<4",
  "numpy>=1.26,<3",
  "psutil>=5.9,<8",
  "PyYAML>=6,<7",
  "scipy>=1.12,<2",
  "xraydb>=4.5,<5",
]

[project.optional-dependencies]
test = ["pytest>=8,<10"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
